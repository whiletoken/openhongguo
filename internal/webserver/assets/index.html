<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红果短剧 - OpenHongguo 客户端</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff2a4b'/><path d='M38 28 L72 50 L38 72 Z' fill='white'/></svg>">
</head>
<body class="theme-dark">
  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand" id="btn-home" title="返回首页">
          <div class="brand-logo">
            <svg viewBox="0 0 100 100">
              <rect width="100" height="100" rx="24" fill="url(#logo-grad)"/>
              <defs>
                <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff4765"/>
                  <stop offset="100%" stop-color="#e0183b"/>
                </linearGradient>
              </defs>
              <path d="M38 28 L74 50 L38 72 Z" fill="#ffffff"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">红果短剧</span>
            <span class="brand-badge">客户端</span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="nav-channels" id="nav-channels">
          <button class="nav-tab active" data-channel="推荐">推荐</button>
          <button class="nav-tab" data-channel="漫剧">漫剧</button>
          <button class="nav-tab" data-channel="真人剧">真人剧</button>
          <button class="nav-tab" data-channel="找剧">找剧</button>
          <button class="nav-tab" data-channel="电影">电影</button>
          <button class="nav-tab" data-channel="经典">经典</button>
        </nav>
      </div>

      <!-- Search Box -->
      <div class="header-search">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="搜索短剧、角色、小说 (按回车搜索)..." autocomplete="off">
          <button id="search-clear" class="search-clear-btn" style="display:none;">&times;</button>
        </div>
        <button id="search-submit" class="search-btn">搜索</button>
      </div>

      <!-- Right Action Tools -->
      <div class="header-right">
        <button class="btn-icon" id="btn-history-toggle" title="观看历史">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="btn-label">历史</span>
        </button>

        <div class="status-indicator" id="system-status-indicator" title="检测系统组件状态">
          <span class="status-dot online"></span>
          <span class="status-text">系统就绪</span>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="app-main">
      <!-- Catalog Grid View -->
      <section id="view-catalog" class="view-section active">
        <div class="section-header">
          <div class="title-with-badge">
            <h2 id="current-channel-title">🔥 精彩推荐</h2>
            <span class="section-subtitle" id="channel-subtitle">实时更新精选短剧</span>
          </div>
          <div class="catalog-filters" id="catalog-filters" style="display:none;">
            <span class="filter-label">筛选:</span>
            <button class="filter-chip active" data-filter="">全部</button>
            <button class="filter-chip" data-filter="content_type_short_play">真人剧</button>
            <button class="filter-chip" data-filter="content_type_dynamic_comic">漫剧</button>
            <button class="filter-chip" data-filter="content_type_long_video">影视</button>
          </div>
        </div>

        <!-- Series Cards Grid -->
        <div class="cards-grid" id="series-grid">
          <!-- Populated by JavaScript -->
        </div>

        <!-- Loading / Load More -->
        <div class="grid-footer">
          <button id="btn-load-more" class="btn-load-more" style="display:none;">加载更多短剧</button>
          <div id="grid-loader" class="loader-spinner" style="display:none;">
            <div class="spinner"></div>
            <span>正在加载短剧资源...</span>
          </div>
          <div id="grid-empty" class="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <p>暂无相关短剧内容，请换个关键词试试</p>
          </div>
        </div>
      </section>

      <!-- Theater / Video Player View -->
      <section id="view-theater" class="view-section" style="display:none;">
        <div class="theater-container">
          <!-- Left: Big Player -->
          <div class="theater-left">
            <div class="player-wrapper" id="player-wrapper">
              <div class="player-back-bar">
                <button class="btn-back" id="btn-player-back">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                  </svg>
                  <span>返回剧目列表</span>
                </button>
                <div class="now-playing-title" id="player-title">正在加载...</div>
              </div>

              <!-- HTML5 Video Tag -->
              <div class="video-container" id="video-container">
                <video id="video-element" controls playsinline preload="auto"></video>
                <div class="video-overlay-loading" id="video-loading" style="display:none;">
                  <div class="spinner"></div>
                  <div class="loading-msg" id="video-loading-msg">正在准备流媒体与解密...</div>
                </div>
              </div>

              <!-- Player Utility Controls Bar -->
              <div class="player-extra-bar">
                <div class="extra-controls-left">
                  <button class="btn-ctrl" id="btn-ep-prev" title="快捷键: [">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                      <polygon points="19,20 9,12 19,4"></polygon>
                      <line x1="5" y1="4" x2="5" y2="20" stroke="currentColor" stroke-width="3"></line>
                    </svg>
                    <span>上一集</span>
                  </button>
                  <button class="btn-ctrl" id="btn-ep-next" title="快捷键: ]">
                    <span>下一集</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                      <polygon points="5,4 15,12 5,20"></polygon>
                      <line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="3"></line>
                    </svg>
                  </button>

                  <label class="toggle-autoplay" title="当前集播完后自动跳转播放下一集">
                    <input type="checkbox" id="chk-autoplay" checked>
                    <span class="toggle-switch"></span>
                    <span class="toggle-text">自动连播</span>
                  </label>
                </div>

                <div class="extra-controls-right">
                  <!-- Quality Selector -->
                  <div class="quality-select-wrapper">
                    <span class="ctrl-label">画质:</span>
                    <select id="select-quality" class="select-dropdown">
                      <option value="1080p">1080p 超清</option>
                      <option value="720p" selected>720p 高清</option>
                      <option value="480p">480p 标清</option>
                      <option value="360p">360p 流畅</option>
                    </select>
                  </div>

                  <!-- External Player Trigger -->
                  <button class="btn-ctrl btn-highlight" id="btn-play-external" title="使用系统本地播放器 (FFplay / MPV / VLC) 独立窗口播放">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                      <line x1="8" y1="21" x2="16" y2="21"></line>
                      <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span>外部播放器</span>
                  </button>

                  <!-- Download Episode -->
                  <button class="btn-ctrl" id="btn-download-ep" title="下载当前集解密后的 MP4">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="7 10 12 15 17 10"></polyline>
                      <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>下载本集</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Right: Series Info & Episodes Drawer -->
          <div class="theater-right">
            <div class="series-panel">
              <!-- Series Info Card -->
              <div class="series-meta-card">
                <div class="meta-cover-wrapper">
                  <img id="theater-series-cover" src="" alt="封面" class="meta-cover">
                </div>
                <div class="meta-details">
                  <h3 class="meta-title" id="theater-series-title">短剧标题</h3>
                  <div class="meta-stats" id="theater-series-stats">
                    <span class="stat-badge badge-primary" id="theater-ep-count">全0集</span>
                    <span class="stat-badge" id="theater-heat">热度 0</span>
                  </div>
                  <div class="meta-tags" id="theater-series-tags">
                    <!-- Tags -->
                  </div>
                </div>
              </div>

              <!-- Summary Collapsible -->
              <div class="series-summary-box">
                <p id="theater-series-summary" class="summary-text">短剧剧情简介...</p>
              </div>

              <!-- Episodes Grid & Paging -->
              <div class="episodes-section">
                <div class="episodes-header">
                  <div class="episodes-title-bar">
                    <h4>选集列表</h4>
                    <span class="ep-total" id="ep-total-label">共 0 集</span>
                  </div>
                  <!-- Smart Cache Sliding Window Status -->
                  <div class="cache-status-bar" id="cache-status-bar" title="智能滑动缓存: 自动缓存后10集，保持最大12集，跳级自动重置">
                    <span class="cache-pill-icon">⚡</span>
                    <span class="cache-status-text" id="cache-status-text">智能缓存: 准备中...</span>
                  </div>
                  <!-- Quick Episode Range Tabs (e.g. 1-30, 31-60) -->
                  <div class="ep-range-tabs" id="ep-range-tabs">
                    <!-- Range tabs -->
                  </div>
                </div>

                <!-- Episode Buttons Grid -->
                <div class="episodes-grid" id="episodes-grid">
                  <!-- Generated episode buttons -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Slide-out History Drawer -->
    <aside class="history-drawer" id="history-drawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h3>观看历史</h3>
        </div>
        <div class="drawer-actions">
          <button class="btn-text-danger" id="btn-clear-history">清空记录</button>
          <button class="btn-close" id="btn-close-history">&times;</button>
        </div>
      </div>
      <div class="drawer-content" id="history-list">
        <!-- History items -->
      </div>
    </aside>
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
