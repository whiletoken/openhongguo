[package]
name = "ohg-desktop"
version = "0.2.0"
edition = "2021"
authors = ["OpenHongguo Contributors"]
description = "OpenHongguo Windows Desktop Client in Rust"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
